name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.list.outputs.countries }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        # Every folder of server/countries, test-only _default included.
        run: |
          countries=$(ls -d server/countries/*/ | xargs -n1 basename | jq -R . | jq -sc .)
          echo "countries=$countries" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: tests
      - run: npm run build
        working-directory: server
      - run: npx tsc --noEmit && npm run build
        working-directory: client

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug -PtntCountry=_default
        working-directory: android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: ./configure.sh _default
        working-directory: ios
      # The simulator name is read from the runner rather than hard-coded: images change which iPhones they have.
      - run: |
          DEVICE="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          xcodebuild test -project TnT.xcodeproj -scheme TnT -only-testing:TnTTests \
            -destination "platform=iOS Simulator,name=$DEVICE" CODE_SIGNING_ALLOWED=NO
        working-directory: ios

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: tests
      - run: npx vitest run
        working-directory: tests

  country-tests:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJson(needs.setup-matrix.outputs.countries) }}
    env:
      TNT_COUNTRY: ${{ matrix.country }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: tests
      - run: npx vitest run
        working-directory: tests
      - run: npm run build
        working-directory: client
      - run: npm run build
        working-directory: server

  standalone-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Export liberia and check it builds and tests with no TNT_COUNTRY
        run: |
          node scripts/export-standalone.mjs liberia "$RUNNER_TEMP/liberia" --git
          cd "$RUNNER_TEMP/liberia"
          (cd server && npm ci && npm run build)
          (cd client && npm ci && npx tsc --noEmit && npm run build)
          (cd tests && npm ci && npx vitest run)
